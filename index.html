<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Storm СНГ: хаб игроков Naruto</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d14;--p:#121722;--p2:#1b2233;--bd:#34405c;--v:#ff7a1a;--v2:#ffb066;--t:#f3ede4;--m:#9ba7c0;--g:#ffd23f;--ok:#4ade80;--no:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(800px 420px at 80% -8%,#5c2a05 0,transparent 62%),var(--bg);color:var(--t);font:15px/1.5 Onest,"Segoe UI",Arial,sans-serif;min-height:100vh}
h1,h2,h3{font-family:"Russo One",Onest,Arial,sans-serif;margin:0}
header{padding:22px 16px 6px;max-width:1100px;margin:auto}h1{font-size:clamp(22px,4.5vw,38px);font-weight:800;letter-spacing:-.5px}h1 b{color:var(--v2);text-shadow:0 0 24px #ff7a1a}
header p{color:var(--m);margin:4px 0 0}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1100px;margin:14px auto 0;padding:0 16px}
nav button{white-space:nowrap;background:none;border:1px solid var(--bd);color:var(--m);padding:8px 14px;border-radius:99px;font:inherit;cursor:pointer}
nav button.on{background:var(--v);border-color:var(--v);color:#fff;box-shadow:0 0 18px #ff7a1a88}
main{max-width:1100px;margin:16px auto;padding:0 16px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
button.b,.bar button{background:var(--p2);border:1px solid var(--bd);color:var(--t);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer}
button.b:hover,.bar button:hover{border-color:var(--v)}button.pri{background:var(--v);border-color:var(--v)}button.sm{padding:4px 10px;font-size:13px}
input,select,textarea{background:#080b12;border:1px solid var(--bd);color:var(--t);padding:8px 10px;border-radius:10px;font:inherit;max-width:100%}
textarea{width:100%;min-height:120px}
:focus-visible{outline:2px solid var(--v2);outline-offset:2px}
.row{display:flex;gap:0;margin-bottom:8px;background:var(--p);border:1px solid var(--bd);border-radius:14px;overflow:hidden;min-height:78px}
.row.over{border-color:var(--v2)}
.lab{width:74px;flex:none;display:grid;place-items:center;font:800 22px "Russo One",Arial;background:var(--p2);border-right:1px solid var(--bd)}
.lab.t0{color:var(--g);background:linear-gradient(135deg,#5a2a0c,#0c0f18);text-shadow:0 0 14px var(--g)}.lab.t1{color:var(--v2)}.lab.tN{font-size:11px;text-align:center;color:var(--m)}
.row.r0{border-color:var(--g);box-shadow:0 0 28px #ff7a1a55}
.pls{display:flex;flex-wrap:wrap;gap:8px;padding:8px;flex:1}
.pl{display:flex;flex-direction:column;align-items:center;width:84px;cursor:pointer;font-size:12.5px;text-align:center}
.pl span{color:var(--m);font-size:11px}
.av{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font:800 20px "Russo One",Arial;color:#fff;border:2px solid #ffffff22;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:12px}
.pc{display:flex;gap:10px;align-items:center;cursor:pointer}.pc small{color:var(--m);display:block}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.m{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--p2);border:1px solid var(--bd);color:var(--v2)}
.ok{color:var(--ok)}.no{color:var(--no)}.mu{color:var(--m)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--m);font-weight:400}
.br{display:flex;gap:18px;overflow-x:auto;padding-bottom:10px}.rd{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:170px}
.bm{background:var(--p);border:1px solid var(--bd);border-radius:10px;overflow:hidden}.bm div{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}.bm div+div{border-top:1px solid var(--bd)}.bm .w{background:#ff7a1a33;color:var(--v2);font-weight:600}
.md{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:16px;z-index:9}.md>div{background:var(--p);border:1px solid var(--v);border-radius:16px;padding:18px;max-width:480px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 0 40px #ff7a1a55}
h2{font-size:18px;margin:18px 0 10px}
.auth input{width:100%}.av{object-fit:cover}#au{display:flex;gap:10px;align-items:center;margin-top:10px}#au .av{width:34px;height:34px;border-radius:50%;font-size:14px}

function vM(){const me=S.me,L=[...S.matches].sort((a,b)=>a.t-b.t),reg=S.players.filter(p=>p.user_id&&(!me||p.id!=me.id));

function vRt(){const L=[...S.players].sort((a,b)=>b.elo-a.elo);return`<div class="bar"><h3>Сезон ${S.season}</h3>${AD()?'<button class="b" data-a="end">Завершить сезон</button> <button class="b" data-a="rsta" style="color:var(--no)">Очистить Win / Lose у всех</button>':''}<span class="mu">Топ-3 уйдёт в зал славы</span></div><div class="card"><table><tr><th>#</th><th>Игрок</th><th>Тир</th><th>Win</th><th>Lose</th><th>Доля побед</th></tr>${L.map((p,i)=>`<tr data-a="open" data-id="${p.id}" style="cursor:pointer"><td>${i+1}</td><td>${esc(p.nick)}</td><td>${p.tier}</td><td><b>${p.w}</b></td><td>${p.l}</td><td>${wr(p)}</td></tr>`).join('')}</table></div><h2>Зал славы</h2>${S.hof.length?S.hof.map(h=>`<div class="card" style="margin-bottom:8px"><b>Сезон ${h.s}</b><div>1 место: <span style="color:var(--g)">${esc(h.t[0]||'')}</span>, 2 место: ${esc(h.t[1]||'')}, 3 место: ${esc(h.t[2]||'')}</div></div>`).join(''):'<p class="mu">Пока пусто. Первый сезон ещё идёт.</p>'}`}
function vInfo(){const c={};S.matches.filter(m=>m.s=='d').forEach(m=>[['ca',m.sa>m.sb],['cb',m.sb>m.sa]].forEach(([k,w])=>{const n=(m[k]||'').trim();if(!n)return;c[n]=c[n]||{g:0,w:0};c[n].g++;if(w)c[n].w++}));const L=Object.entries(c).sort((a,b)=>b[1].g-a[1].g);

function modal(){const p=P(ui.open),me=S.me,own=me&&me.id==p.id,can=own||AD(),h=S.matches.filter(m=>m.s=='d'&&(m.a==p.id||m.b==p.id)).slice(-6).reverse();
return`<div class="md" data-a="close"><div><div class="pc" style="cursor:default">${av(p)}<div><h3>${esc(p.nick)}</h3><small>Тир ${p.tier} · ${p.w}W / ${p.l}L · ${wr(p)}</small></div></div>${!S.user&&!p.user_id?claimBox(p):''}${own?avBox():''}${can?`<h2>Ник</h2><input id="pn" value="${esc(p.nick)}" maxlength="24" placeholder="Твой ник" style="width:100%">`:''}<h2>Любимые персонажи</h2>${can?`<input id="pc" list="chl" value="${esc(p.ch)}" placeholder="Через запятую" style="width:100%"><datalist id="chl">${CH.map(x=>`<option value="${x}">`).join('')}</datalist>`:`<div>${esc(p.ch)||'<span class="mu">Не указаны</span>'}</div>`}${AD()?`<h2>Статистика (админ)</h2><div class="f"><button class="b" data-a="rst" data-id="${p.id}" style="color:var(--no)">Очистить Win / Lose</button></div>`:''}${AD()?`<h2>Тир (админ)</h2><div class="f"><select id="pt">${T.map(t=>`<option${t==p.tier?' selected':''}>${t}</option>`).join('')}</select></div>`:''}${AD()&&!p.user_id?`<h2>Discord-логин игрока</h2><div class="f"><input id="pdn" value="${esc(p.dname||'')}" placeholder="например kiritsugu_newera" maxlength="40"><button class="b pri" data-a="lk" data-id="${p.id}">Сохранить логин</button></div><small class="mu">Когда игрок зайдёт через Discord с этим логином, он сам встанет на это место</small>`:''}${AD()&&!p.user_id?`<h2>Привязать к аккаунту Discord</h2><div class="f"><select id="pm">${S.all.filter(x=>x.user_id).map(x=>`<option value="${x.id}">${esc(x.nick)}</option>`).join('')}</select><button class="b" data-a="mg" data-id="${p.id}">Привязать</button></div>`:''}<h2>Последние бои</h2>${h.length?h.map(m=>{const a=m.a==p.id,w=(m.sa>m.sb)==a;return`<div>${w?'<span class="ok">Win</span>':'<span class="no">Lose</span>'} против ${esc(P(a?m.b:m.a).nick)} ${m.sa}:${m.sb}</div>`}).join(''):'<span class="mu">Боёв ещё не было</span>'}<div class="f" style="margin:16px 0 0">${can?`<button class="b pri" data-a="sp" data-id="${p.id}">Сохранить</button>`:''}<button class="b" data-a="close">Закрыть</button>${AD()?`<button class="b" data-a="${p.listed?'unl':'list'}" data-id="${p.id}">${p.listed?'Убрать из тир-листа':'В тир-лист'}</button><button class="b" data-a="del" data-id="${p.id}">Удалить игрока</button>`:''}</div></div></div>`}

const aerr=m=>{m=String(m||'');return/Invalid login/i.test(m)?'Неверная почта или пароль':/already registered/i.test(m)?'Эта почта уже зарегистрирована':/at least 6|weak/i.test(m)?'Пароль должен быть не короче 6 символов':/not confirmed/i.test(m)?'Сначала подтверди почту по письму':/valid email|invalid format/i.test(m)?'Проверь адрес почты':/rate limit/i.test(m)?'Слишком много попыток, подожди немного':m};
async function doAuth(k){const em=V('ae').trim(),pw=V('ap');ui.aerr='';ui.ainfo='';const fail=t=>{ui.aerr=t;const e=$('#aerr');if(e)e.textContent=t};
if(!em||!pw)return fail('Введи почту и пароль');
if(k=='si'){const r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)return fail(aerr(r.error.message));ui.auth=null;return load()}
const nn=V('an').trim();if(nn.length<2||nn.length>24)return fail('Ник должен быть от 2 до 24 символов');if(pw.length<6)return fail('Пароль должен быть не короче 6 символов');
const f=await sb.rpc('nick_free',{p_nick:nn});if(f.error)return fail(aerr(f.error.message));if(f.data===false)return fail('Такой ник уже занят');
const r=await sb.auth.signUp({email:em,password:pw,options:{data:{nick:nn},emailRedirectTo:location.origin+location.pathname}});
if(r.error)return fail(aerr(r.error.message));
if(r.data.session){ui.auth=null;return load()}
if(r.data.user&&r.data.user.identities&&!r.data.user.identities.length)return fail('Эта почта уже зарегистрирована');
ui.auth='in';ui.ainfo='Готово! Мы отправили письмо на '+em+'. Перейди по ссылке в нём, затем войди.';R()}
async function resetStats(ids){if(!ids.length)return;const r=await sb.from('profiles').update({w:0,l:0}).in('id',ids).select();if(r.error){alert(r.error.message);return}if(!r.data||!r.data.length||r.data.some(x=>x.w||x.l))alert('Статистика не очистилась: в Supabase нет права админу менять w и l. Нужно выполнить SQL из чата.')}

document.addEventListener('click',async e=>{const a=e.target.closest('[data-a]');if(!a)return;const d=a.dataset,id=d.id;

if(r.data.user&&r.data.user.identities&&!r.data.user.identities.length)return er('Эта почта уже зарегистрирована. Войди через кнопку «Войти / Регистрация»');

if(d.a=='dc'){await sb.auth.signInWithOAuth({provider:'discord',options:{redirectTo:location.origin+location.pathname}});return}
if(d.a=='out'){await sb.auth.signOut();return load()}

if(d.a=='auto')await Promise.all(S.players.filter(p=>p.tier!='N').map(p=>{const t=p.elo>=1560?'S+':p.elo>=1460?'S':p.elo>=1360?'A':'B';return t==p.tier?0:sb.from('profiles').update({tier:t}).eq('id',p.id)}));
else if(d.a=='addp'){const n=V('np').trim();if(n)await Q(sb.from('profiles').insert({nick:n}))}
else if(d.a=='sp'){const own=S.me&&S.me.id==id;const nn=V('pn').trim();if(nn.length<2||nn.length>24){alert('Ник должен быть от 2 до 24 символов');return}
if(AD())await Q(sb.from('profiles').update({nick:nn,ch:V('pc').trim(),tier:V('pt')}).eq('id',id));else if(own){if(await Q(sb.rpc('set_nick',{p_nick:nn})))await Q(sb.rpc('set_chars',{p_ch:V('pc').trim()}))}ui.open=null}
else if(d.a=='lk'){await Q(sb.rpc('adm_link',{p_ph:id,p_name:V('pdn')}));ui.open=null}
else if(d.a=='list'||d.a=='unl'){await Q(sb.from('profiles').update({listed:d.a=='list'}).eq('id',id));ui.open=null}
else if(d.a=='del'){if(confirm('Удалить игрока и его бои?')){await Q(sb.from('profiles').delete().eq('id',id));ui.open=null}}
else if(d.a=='mg'){await Q(sb.rpc('adm_merge',{p_ph:id,p_real:V('pm')}));ui.open=null}
else if(d.a=='chal'){const t=new Date(V('mt')).getTime();if(!V('mb')||!t){alert('Выбери соперника, дату и время');return}await Q(sb.from('matches').insert({a:S.me.id,b:V('mb'),t:new Date(t).toISOString(),f:V('mf'),s:'p'}))}
else if(d.a=='acc')await M('acc');else if(d.a=='dec')await M('dec');else if(d.a=='dis')await M('dis');
else if(d.a=='delm'){if(!S.admin)return;const mm=S.matches.find(z=>z.id==id),pl=mm&&mm.s=='d'?' Победы и поражения игроков при этом сами не изменятся.':'';if(confirm('Удалить этот бой навсегда?'+pl)){const r=await sb.from('matches').delete().eq('id',id).select();if(r.error)alert(r.error.message);else if(!r.data||!r.data.length)alert('Бой не удалён: в Supabase нет права на удаление боёв для админа. Нужно выполнить SQL-политику (см. подсказку в чате).')}}
else if(d.a=='res'){const x=+V('sa'+id),y=+V('sb'+id);if(x==y){alert('Ничьей не бывает: счёт должен быть разный');return}const mm=S.matches.find(z=>z.id==id),ft=mm&&/^FT(\d+)$/.exec(mm.f);if(ft&&Math.max(x,y)!=+ft[1]){alert('В формате '+mm.f+' победитель должен набрать ровно '+ft[1]+' побед');return}await M('res',{p_sa:x,p_sb:y,p_ca:V('ca'+id),p_cb:V('cb'+id)})}
else if(d.a=='cf')await M('cf',{p_k:d.k});
else if(d.a=='mk'){const n=+V('bn');if(S.br&&!confirm('Текущая сетка будет заменена пустой. Продолжить?'))return;S.br=[Array.from({length:n/2},()=>({a:null,b:null,w:null}))];while(S.br[S.br.length-1].length>1)S.br.push(Array.from({length:S.br[S.br.length-1].length/2},()=>({a:null,b:null,w:null})));await saveBr()}
else if(d.a=='rm'){if(!AD())return;const i=+d.i,x=S.br[0][i];if(x.w)clr(0,i);x.w=null;x[d.k]=null;await saveBr()}
else if(d.a=='win'){if(!AD())return;const r=+d.r,i=+d.i,x=S.br[r][i];if(!x[d.k])return;if(x.w)clr(r,i);x.w=d.k;if(r+1<S.br.length)S.br[r+1][i>>1][i%2?'b':'a']=x[d.k];await saveBr()}
else if(d.a=='rst'){if(!S.admin)return;const p=P(id);if(confirm('Очистить Win / Lose у игрока '+p.nick+'? Сейчас: '+p.w+'W / '+p.l+'L'))await resetStats([id])}
else if(d.a=='rsta'){if(!S.admin)return;if(confirm('Очистить Win / Lose у ВСЕХ игроков? Это нельзя отменить.'))await resetStats(S.all.map(x=>x.id))}
else if(d.a=='end'){if(confirm('Завершить сезон? Победы и поражения обнулятся.'))await Q(sb.rpc('end_season'))}
else if(d.a=='avx'){if(confirm('Убрать аватар?'))await Q(sb.rpc('set_avatar',{p_url:null}))}
else if(d.a=='rul')await Q(sb.from('app_state').upsert({key:'rules',val:V('rl')}));
await load()});
document.addEventListener('change',async e=>{const t=e.target;if(!t||t.id!='pf'||!t.files||!t.files[0]||!S.user)return;const say=x=>{const o=$('#pfs');if(o)o.textContent=x},f=t.files[0];
if(!/^image\//.test(f.type))return say('Выбери картинку');if(f.size>15*1048576)return say('Файл слишком большой (до 15 МБ)');say('Загружаю...');
try{const img=await new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>no(new Error('Не удалось открыть картинку, попробуй JPG или PNG'));i.src=u});
const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,256,256);
const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85)),path=S.user.id+'/avatar.jpg';
const up=await sb.storage.from('avatars').upload(path,blob,{upsert:true,contentType:'image/jpeg'});if(up.error)throw up.error;
const r=await sb.rpc('set_avatar',{p_url:sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?v='+Date.now()});if(r.error)throw r.error;
await load()}catch(er){say('Ошибка: '+(er.message||er))}});
document.addEventListener('dragstart',e=>{const p=e.target.closest('.pl');if(p&&AD())e.dataTransfer.setData('text',p.dataset.id)});
document.addEventListener('dragover',e=>{if(AD()&&e.target.closest('.row'))e.preventDefault()});
document.addEventListener('drop',async e=>{const r=e.target.closest('.row');if(!r||!AD())return;e.preventDefault();const id=e.dataTransfer.getData('text');if(id){await Q(sb.from('profiles').update({tier:r.dataset.t}).eq('id',id));load()}});
document.addEventListener('change',async e=>{const t=e.target.closest&&e.target.closest('select[data-slot]');if(!t||!AD()||!t.value||!S.br)return;const [i,k]=t.dataset.slot.split(':');const x=S.br[0][+i];if(!x)return;x[k]=t.value;await saveBr();await load()});
sb.auth.onAuthStateChange(()=>{if(!ui.auth)setTimeout(load,0)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.closest&&e.target.closest('.auth')){const b=document.querySelector('.auth [data-a=si],.auth [data-a=su]');if(b)b.click()}});
load();setInterval(()=>{if(!ui.open&&!ui.auth&&!document.querySelector('input:focus,textarea:focus,select:focus'))load()},30000);
</script></body></html>
