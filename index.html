<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Storm СНГ: хаб игроков</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06030d;--p:#110a20;--p2:#1a0f33;--bd:#2e1a58;--v:#8b5cf6;--v2:#c4a1ff;--t:#ece6fb;--m:#9a8cbf;--g:#f2c14e;--ok:#4ade80;--no:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(800px 420px at 80% -8%,#2b0f68 0,transparent 62%),var(--bg);color:var(--t);font:15px/1.5 Onest,"Segoe UI",Arial,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Unbounded,Onest,Arial,sans-serif;margin:0}
header{padding:22px 16px 6px;max-width:1100px;margin:auto}h1{font-size:clamp(22px,4.5vw,38px);font-weight:800;letter-spacing:-.5px}h1 b{color:var(--v2);text-shadow:0 0 24px #8b5cf6}
header p{color:var(--m);margin:4px 0 0}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1100px;margin:14px auto 0;padding:0 16px}
nav button{white-space:nowrap;background:none;border:1px solid var(--bd);color:var(--m);padding:8px 14px;border-radius:99px;font:inherit;cursor:pointer}
nav button.on{background:var(--v);border-color:var(--v);color:#fff;box-shadow:0 0 18px #8b5cf688}
main{max-width:1100px;margin:16px auto;padding:0 16px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
button.b,.bar button{background:var(--p2);border:1px solid var(--bd);color:var(--t);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer}
button.b:hover,.bar button:hover{border-color:var(--v)}button.pri{background:var(--v);border-color:var(--v)}button.sm{padding:4px 10px;font-size:13px}
input,select,textarea{background:#0b0616;border:1px solid var(--bd);color:var(--t);padding:8px 10px;border-radius:10px;font:inherit;max-width:100%}
textarea{width:100%;min-height:120px}
:focus-visible{outline:2px solid var(--v2);outline-offset:2px}
.row{display:flex;gap:0;margin-bottom:8px;background:var(--p);border:1px solid var(--bd);border-radius:14px;overflow:hidden;min-height:78px}
.row.over{border-color:var(--v2)}
.lab{width:74px;flex:none;display:grid;place-items:center;font:800 22px Unbounded,Arial;background:var(--p2);border-right:1px solid var(--bd)}
.lab.t0{color:var(--g);background:linear-gradient(135deg,#3a1f6e,#14092a);text-shadow:0 0 14px var(--g)}.lab.t1{color:var(--v2)}.lab.tN{font-size:11px;text-align:center;color:var(--m)}
.row.r0{border-color:var(--g);box-shadow:0 0 28px #8b5cf655}
.pls{display:flex;flex-wrap:wrap;gap:8px;padding:8px;flex:1}
.pl{display:flex;flex-direction:column;align-items:center;width:84px;cursor:pointer;font-size:12.5px;text-align:center}
.pl span{color:var(--m);font-size:11px}
.av{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font:800 20px Unbounded,Arial;color:#fff;border:2px solid #ffffff22;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:12px}
.pc{display:flex;gap:10px;align-items:center;cursor:pointer}.pc small{color:var(--m);display:block}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.m{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--p2);border:1px solid var(--bd);color:var(--v2)}
.ok{color:var(--ok)}.no{color:var(--no)}.mu{color:var(--m)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--m);font-weight:400}
.br{display:flex;gap:18px;overflow-x:auto;padding-bottom:10px}.rd{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:170px}
.bm{background:var(--p);border:1px solid var(--bd);border-radius:10px;overflow:hidden}.bm div{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}.bm div+div{border-top:1px solid var(--bd)}.bm .w{background:#8b5cf633;color:var(--v2);font-weight:600}
.md{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:16px;z-index:9}.md>div{background:var(--p);border:1px solid var(--v);border-radius:16px;padding:18px;max-width:480px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 0 40px #8b5cf655}
h2{font-size:18px;margin:18px 0 10px}
</style></head><body>
<header><h1>Storm <b>СНГ</b></h1><p>Рейтинг, вызовы и турниры игроков Naruto Ultimate Storm</p></header>
<nav id="nv"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=['S+','S','A','B','N'],E0={'S+':1600,S:1500,A:1400,B:1300,N:1200};
const CH=['Наруто (Режим Бариона)','Саске (Сусано)','Хаширама','Тобирама','Мадара','Итачи','Какаши','Минато','Обито','Кагуя','Орочимару','Джирайя','Пейн','Гай','Рок Ли','Хината','Саратсугу','Кисаме'];
function init(){const L={'S+':['dmitriyxboost','kiritsugu_newera','gigond'],S:['Baxmood','deltaflare','earlgrey','mr_romka'],A:['susano','vanzaria','RageFlash','Shinobu','JaneDaArc','Kasl'],B:['whysorryx','AoiHaru','geralbot','step_brother','enzors','saint'],N:['Exodia','sutoresu','yellow_flash','bankai']};let n=0,pl=[];for(const t of T)for(const k of L[t])pl.push({id:++n,nick:k,tier:t,elo:E0[t],w:0,l:0,ch:''});return{players:pl,matches:[],nid:100,season:1,hof:[],br:null,rules:'Формат: Bo3, финал Bo5\nБаги и абьюз запрещены\nОпоздание больше 15 минут: техническое поражение\nСпорные результаты решает админ'}}
let S;try{S=JSON.parse(localStorage.getItem('stormhub1'))}catch(e){}if(!S)S=init();
const ui={tab:'tier',adm:false,open:null};
const save=()=>{try{localStorage.setItem('stormhub1',JSON.stringify(S))}catch(e){}};
const P=id=>S.players.find(p=>p.id==id)||{nick:'удалён',tier:'N',elo:0,w:0,l:0,id:0};
const av=p=>{let h=0;for(const c of p.nick)h=(h*31+c.charCodeAt(0))%360;return`<div class="av" style="background:linear-gradient(135deg,hsl(${(h%60)+250} 65% 48%),hsl(${(h%60)+280} 60% 16%))">${esc(p.nick[0].toUpperCase())}</div>`};
const wr=p=>p.w+p.l?Math.round(100*p.w/(p.w+p.l))+'%':'нет боёв';
const when=t=>{const d=t-Date.now(),s=new Date(t).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});return s+' ('+(d<=0?'время пришло':'через '+(d>864e5?Math.round(d/864e5)+' дн':d>36e5?Math.round(d/36e5)+' ч':Math.max(1,Math.round(d/6e4))+' мин'))+')'};
const opts=(sel)=>S.players.map(p=>`<option value="${p.id}"${p.id==sel?' selected':''}>${esc(p.nick)}</option>`).join('');
const TABS=[['tier','Тир-лист'],['pl','Игроки'],['m','Бои'],['br','Турнир'],['rt','Рейтинг'],['info','Правила и статистика']];
function R(){$('#nv').innerHTML=TABS.map(t=>`<button data-a="tab" data-t="${t[0]}" class="${ui.tab==t[0]?'on':''}">${t[1]}</button>`).join('');
$('#app').innerHTML=({tier:vTier,pl:vPl,m:vM,br:vBr,rt:vRt,info:vInfo})[ui.tab]()+(ui.open?modal():'');save()}
function vTier(){return`<div class="bar"><button data-a="adm" class="${ui.adm?'pri':''}">${ui.adm?'Режим админа включён':'Режим админа'}</button>${ui.adm?'<button data-a="auto">Расставить по рейтингу</button><span class="mu">Перетаскивай игроков между рядами. Non playable остаётся как есть</span>':''}</div>`+T.map((t,i)=>`<div class="row r${i==0?0:''}" data-t="${t}"><div class="lab t${i<1?0:i<2?1:t=='N'?'N':''}">${t=='N'?'Non playable':t}</div><div class="pls">${S.players.filter(p=>p.tier==t).sort((a,b)=>b.elo-a.elo).map(p=>`<div class="pl" data-a="open" data-id="${p.id}" draggable="${ui.adm}">${av(p)}${esc(p.nick)}<span>${p.elo}</span></div>`).join('')}</div></div>`).join('')}
function vPl(){return`<div class="f"><input id="np" placeholder="Ник нового игрока" maxlength="24"><button class="b pri" data-a="addp">Добавить игрока</button></div><div class="grid">${S.players.map(p=>`<div class="card pc" data-a="open" data-id="${p.id}">${av(p)}<div><b>${esc(p.nick)}</b><small>Тир ${p.tier} · ${p.elo}</small><small>${p.w}П / ${p.l}П · ${wr(p)}</small></div></div>`).join('')}</div>`}
function vM(){const L=[...S.matches].sort((a,b)=>a.t-b.t);return`<div class="card"><h3>Вызвать на бой</h3><div class="f" style="margin:12px 0 0"><select id="ma">${opts()}</select><span class="mu">против</span><select id="mb">${opts(S.players[1]&&S.players[1].id)}</select><input id="mt" type="datetime-local"><select id="mf"><option>Bo1</option><option selected>Bo3</option><option>Bo5</option></select><button class="b pri" data-a="chal">Вызвать</button></div></div><h2>Расписание и результаты</h2>${L.length?L.map(mc).join(''):'<p class="mu">Боёв пока нет. Вызови кого-нибудь выше.</p>'}`}
function mc(m){const a=P(m.a),b=P(m.b);let st='',x='';
if(m.s=='p'){st='Ждёт ответа';x=`<button class="b sm pri" data-a="acc" data-id="${m.id}">Принять</button> <button class="b sm" data-a="dec" data-id="${m.id}">Отклонить</button>`}
if(m.s=='a'){st='Принят';x=`<input id="sa${m.id}" type="number" min="0" max="5" placeholder="${esc(a.nick)}" style="width:76px"> : <input id="sb${m.id}" type="number" min="0" max="5" placeholder="${esc(b.nick)}" style="width:76px"> <input id="ca${m.id}" list="chl" placeholder="Персонаж 1" style="width:130px"><input id="cb${m.id}" list="chl" placeholder="Персонаж 2" style="width:130px"> <button class="b sm pri" data-a="res" data-id="${m.id}">Внести счёт</button>`}
if(m.s=='c'){st='Ждёт подтверждения '+m.sa+':'+m.sb;x=['a','b'].map(k=>m['y'+k]?`<span class="ok">${esc(P(m[k]).nick)} подтвердил</span>`:`<button class="b sm pri" data-a="cf" data-id="${m.id}" data-k="${k}">Подтвердить: ${esc(P(m[k]).nick)}</button>`).join(' ')+` <button class="b sm" data-a="dis" data-id="${m.id}">Оспорить</button>`}
if(m.s=='d'){st=`Сыгран ${m.sa}:${m.sb}`;x=`<span class="ok">+${m.dl}</span> <span class="no">-${m.dl}</span> к рейтингу победителя и проигравшего`}
return`<div class="card" style="margin-bottom:8px"><div class="m"><b>${esc(a.nick)} против ${esc(b.nick)}</b><span class="tag">${m.f}</span></div><div class="mu">${when(m.t)}</div><div class="m" style="margin-top:8px"><span class="tag">${st}</span><span>${x}</span></div></div>`}
function elo(m){const a=P(m.a),b=P(m.b),w=m.sa>m.sb,ea=1/(1+Math.pow(10,(b.elo-a.elo)/400)),d=Math.round(32*((w?1:0)-ea));a.elo+=d;b.elo-=d;m.dl=Math.abs(d);(w?a:b).w++;(w?b:a).l++;m.s='d'}
function vBr(){const R_=S.br;let h=`<div class="f"><select id="bn"><option>4</option><option>8</option><option>16</option></select><button class="b pri" data-a="mk">Создать сетку по рейтингу</button><span class="mu">Участвуют лучшие по рейтингу, 1 играет с последним</span></div>`;if(!R_)return h+'<p class="mu">Сетки нет. Выбери размер и создай турнир.</p>';
h+='<div class="br">'+R_.map((r,ri)=>`<div class="rd">${r.map((m,i)=>`<div class="bm">${['a','b'].map(k=>`<div class="${m.w==k?'w':''}" data-a="win" data-r="${ri}" data-i="${i}" data-k="${k}"><span>${m[k]?esc(P(m[k]).nick):'ждём'}</span><span class="mu">${m[k]?P(m[k]).elo:''}</span></div>`).join('')}</div>`).join('')}</div>`).join('')+'</div>';const f=R_[R_.length-1][0];if(f.w)h+=`<h2>Чемпион: <span style="color:var(--g)">${esc(P(f[f.w]).nick)}</span></h2>`;return h+'<p class="mu">Нажми на ник, чтобы отметить победителя матча.</p>'}
function clr(r,i){const R_=S.br;if(r+1>=R_.length)return;const n=R_[r+1][i>>1];n[i%2?'b':'a']=null;if(n.w){n.w=null;clr(r+1,i>>1)}}
function vRt(){const L=[...S.players].sort((a,b)=>b.elo-a.elo);return`<div class="bar"><h3>Сезон ${S.season}</h3><button class="b" data-a="end">Завершить сезон</button><span class="mu">Топ-3 уйдёт в зал славы, рейтинг сожмётся к середине</span></div><div class="card"><table><tr><th>#</th><th>Игрок</th><th>Тир</th><th>Рейтинг</th><th>Победы</th><th>Поражения</th><th>Доля побед</th></tr>${L.map((p,i)=>`<tr data-a="open" data-id="${p.id}" style="cursor:pointer"><td>${i+1}</td><td>${esc(p.nick)}</td><td>${p.tier}</td><td><b>${p.elo}</b></td><td>${p.w}</td><td>${p.l}</td><td>${wr(p)}</td></tr>`).join('')}</table></div><h2>Зал славы</h2>${S.hof.length?S.hof.map(h=>`<div class="card" style="margin-bottom:8px"><b>Сезон ${h.s}</b><div>1 место: <span style="color:var(--g)">${esc(h.t[0]||'')}</span>, 2 место: ${esc(h.t[1]||'')}, 3 место: ${esc(h.t[2]||'')}</div></div>`).join(''):'<p class="mu">Пока пусто. Первый сезон ещё идёт.</p>'}`}
function vInfo(){const c={};S.matches.filter(m=>m.s=='d').forEach(m=>[['ca',m.sa>m.sb],['cb',m.sb>m.sa]].forEach(([k,w])=>{const n=(m[k]||'').trim();if(!n)return;c[n]=c[n]||{g:0,w:0};c[n].g++;if(w)c[n].w++}));const L=Object.entries(c).sort((a,b)=>b[1].g-a[1].g);
return`<div class="card"><h3>Правила и банлист</h3><div class="f" style="margin:10px 0 0"><textarea id="rl" ${ui.adm?'':'readonly'}>${esc(S.rules)}</textarea>${ui.adm?'<button class="b pri" data-a="rul">Сохранить правила</button>':'<span class="mu">Редактировать правила можно в режиме админа на странице тир-листа</span>'}</div></div><h2>Статистика персонажей</h2><div class="card">${L.length?`<table><tr><th>Персонаж</th><th>Боёв</th><th>Доля побед</th></tr>${L.map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v.g}</td><td>${Math.round(100*v.w/v.g)}%</td></tr>`).join('')}</table>`:'<span class="mu">Появится, когда в результатах боёв будут указаны персонажи.</span>'}</div><datalist id="chl">${CH.map(x=>`<option value="${x}">`).join('')}</datalist>`}
function modal(){const p=P(ui.open),h=S.matches.filter(m=>m.s=='d'&&(m.a==p.id||m.b==p.id)).slice(-6).reverse();return`<div class="md" data-a="close"><div><div class="pc" style="cursor:default">${av(p)}<div><h3>${esc(p.nick)}</h3><small>Тир ${p.tier} · рейтинг ${p.elo} · ${p.w}П / ${p.l}П · ${wr(p)}</small></div></div><h2>Любимые персонажи</h2><input id="pc" list="chl" value="${esc(p.ch||'')}" placeholder="Через запятую" style="width:100%">${ui.adm?`<h2>Тир (админ)</h2><select id="pt">${T.map(t=>`<option${t==p.tier?' selected':''}>${t}</option>`).join('')}</select>`:''}<h2>Последние бои</h2>${h.length?h.map(m=>{const me=m.a==p.id,won=(m.sa>m.sb)==me;return`<div>${won?'<span class="ok">Победа</span>':'<span class="no">Поражение</span>'} против ${esc(P(me?m.b:m.a).nick)} ${m.sa}:${m.sb}</div>`}).join(''):'<span class="mu">Боёв ещё не было</span>'}<div class="f" style="margin:16px 0 0"><button class="b pri" data-a="sp" data-id="${p.id}">Сохранить</button><button class="b" data-a="close">Закрыть</button>${ui.adm?`<button class="b" data-a="del" data-id="${p.id}">Удалить игрока</button>`:''}</div></div></div>`}
const V=id=>{const e=document.getElementById(id);return e?e.value:''};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const d=a.dataset,id=+d.id,m=S.matches.find(x=>x.id==id);
if(d.a=='close'){if(e.target.closest('.md>div')&&!e.target.closest('button'))return;ui.open=null}
else if(e.target.closest('.md')&&d.a!='sp'&&d.a!='del'&&d.a!='close')return;
else if(d.a=='tab'){ui.tab=d.t}else if(d.a=='adm')ui.adm=!ui.adm;
else if(d.a=='auto'){S.players.forEach(p=>{if(p.tier!='N')p.tier=p.elo>=1560?'S+':p.elo>=1460?'S':p.elo>=1360?'A':'B'})}
else if(d.a=='open')ui.open=id;
else if(d.a=='addp'){const n=V('np').trim();if(n&&!S.players.some(p=>p.nick.toLowerCase()==n.toLowerCase()))S.players.push({id:++S.nid,nick:n,tier:'B',elo:1300,w:0,l:0,ch:''})}
else if(d.a=='sp'){const p=P(id);p.ch=V('pc').trim();if(ui.adm&&V('pt'))p.tier=V('pt');ui.open=null}
else if(d.a=='del'){S.players=S.players.filter(p=>p.id!=id);S.matches=S.matches.filter(x=>x.a!=id&&x.b!=id);ui.open=null}
else if(d.a=='chal'){const A=+V('ma'),B=+V('mb'),t=new Date(V('mt')).getTime();if(A==B||!t){alert('Выбери двух разных игроков и дату с временем');return}S.matches.push({id:++S.nid,a:A,b:B,t,f:V('mf'),s:'p'})}
else if(d.a=='acc')m.s='a';else if(d.a=='dec')S.matches=S.matches.filter(x=>x.id!=id);
else if(d.a=='res'){const a=+V('sa'+id),b=+V('sb'+id);if(a==b){alert('Ничьей не бывает: счёт должен быть разный');return}Object.assign(m,{sa:a,sb:b,ca:V('ca'+id),cb:V('cb'+id),s:'c',ya:0,yb:0})}
else if(d.a=='cf'){m['y'+d.k]=1;if(m.ya&&m.yb)elo(m)}
else if(d.a=='dis')m.s='a';
else if(d.a=='mk'){const n=+V('bn'),L=[...S.players].filter(p=>p.tier).sort((a,b)=>b.elo-a.elo).slice(0,n);if(L.length<n){alert('Игроков меньше, чем мест в сетке');return}let r=[];for(let i=0;i<n/2;i++)r.push({a:L[i].id,b:L[n-1-i].id,w:null});S.br=[r];while(S.br[S.br.length-1].length>1)S.br.push(Array.from({length:S.br[S.br.length-1].length/2},()=>({a:null,b:null,w:null})))}
else if(d.a=='win'){const r=+d.r,i=+d.i,x=S.br[r][i];if(!x[d.k])return;if(x.w){clr(r,i)}x.w=d.k;if(r+1<S.br.length)S.br[r+1][i>>1][i%2?'b':'a']=x[d.k]}
else if(d.a=='end'){const L=[...S.players].sort((a,b)=>b.elo-a.elo);S.hof.push({s:S.season,t:L.slice(0,3).map(p=>p.nick)});S.players.forEach(p=>{p.elo=Math.round((p.elo+1400)/2);p.w=0;p.l=0});S.season++;S.br=null}
else if(d.a=='rul')S.rules=V('rl');
R()});
document.addEventListener('dragstart',e=>{const p=e.target.closest('.pl');if(p&&ui.adm)e.dataTransfer.setData('text',p.dataset.id)});
document.addEventListener('dragover',e=>{if(ui.adm&&e.target.closest('.row'))e.preventDefault()});
document.addEventListener('drop',e=>{const r=e.target.closest('.row');if(!r||!ui.adm)return;e.preventDefault();const p=P(+e.dataTransfer.getData('text'));if(p.id){p.tier=r.dataset.t;R()}});
R();
</script></body></html>
